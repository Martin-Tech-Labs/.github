<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Test pyramid</title>
  <desc id="desc">Unit tests form the wide base and isolate components with mocked dependencies. Integration tests connect components and real services. Acceptance tests form the narrow top and exercise API or UI scenarios against the application and dependencies running in Docker Compose. Higher levels have broader scope and usually take longer to run.</desc>
  <rect width="1120" height="650" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="57" font-size="30" font-weight="700" fill="#0f172a">The test pyramid</text>
    <text x="48" y="89" font-size="17" fill="#475569">Many focused checks at the base; fewer complete user scenarios at the top.</text>
    <path d="M310 130 L223 275 L397 275 Z" fill="#6d28d9"/>
    <path d="M217 285 L139 415 L481 415 L403 285 Z" fill="#0369a1"/>
    <path d="M133 425 L55 555 L565 555 L487 425 Z" fill="#047857"/>
    <g fill="#ffffff" font-weight="700" text-anchor="middle">
      <text x="310" y="250" font-size="19">Acceptance</text>
      <text x="310" y="365" font-size="23">Integration</text>
      <text x="310" y="500" font-size="26">Unit</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="2">
      <path d="M387 250 H612"/>
      <path d="M453 365 H612"/>
      <path d="M532 500 H612"/>
    </g>
    <g fill="#0f172a" font-size="20" font-weight="700">
      <text x="635" y="195">Acceptance tests</text>
      <text x="635" y="335">Integration tests</text>
      <text x="635" y="475">Unit tests</text>
    </g>
    <g fill="#334155" font-size="17">
      <text x="635" y="225">High-level API / UI user scenarios</text>
      <text x="635" y="251">Compose: application + dependencies</text>
      <text x="635" y="277">API tools: Supertest / Mocha / Chai</text>
      <text x="635" y="365">Multiple components + database / APIs</text>
      <text x="635" y="391">Compose for dependencies when needed</text>
      <text x="635" y="417">Example framework: xUnit</text>
      <text x="635" y="505">Individual components; mock dependencies</text>
      <text x="635" y="531">No database, external API, or Compose</text>
      <text x="635" y="557">Example framework: xUnit</text>
    </g>
    <rect x="48" y="592" width="1024" height="34" rx="8" fill="#e2e8f0"/>
    <text x="560" y="615" text-anchor="middle" font-size="16" fill="#334155">Toward the top: broader scope and typically slower execution. Test counts are not fixed quotas.</text>
  </g>
</svg>
