name: Task
description: Track implementation or investigation work.
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the work to perform or the question to investigate.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe how completion will be verified. For an investigation, state the findings, recommendation, or decision needed.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: Optional issue reference or URL. Add this Task as a sub-issue of its parent after creation; this field does not link the hierarchy automatically.
      placeholder: '#123 or an issue URL'
